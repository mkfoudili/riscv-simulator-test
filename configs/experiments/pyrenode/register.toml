[experiment]
name = "pyrenode_register_fault"

[program]
name = "register_test"
elf = "register_test.elf"

[execution]
mode = "pyrenode"
inject_at = "fault_injection_point"
end_at = "end"
output_register = "x10"

[simulator]
name = "renode"
timeout = 5.0
platform = "../../simulators/renode/riscv_min.repl"

[fault]
type = "register"
register = "x5"
value = "0x11111101"
